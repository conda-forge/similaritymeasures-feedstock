{% set name = "similaritymeasures" %}
{% set version = "1.5.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/similaritymeasures-{{ version }}.tar.gz
  sha256: 1efce9ea999a0e0e8fe9c75b7e4de142c2a0b0a271797bef25fc2e1555699e6e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - numpy >=1.14.0
    - python >={{ python_min }}
    - scipy >=0.19.0

test:
  imports:
    - similaritymeasures
  commands:
    - pip check
  requires:
    - pip
    - setuptools
    - python {{ python_min }}

about:
  home: https://github.com/cjekel/similarity_measures
  summary: Quantify the difference between two arbitrary curves in space
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/cjekel/similarity_measures
  doc_url: https://jekel.me/similarity_measures/index.html

extra:
  recipe-maintainers:
    - kellend-git
