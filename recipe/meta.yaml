{% set name = "similaritymeasures" %}
{% set version = "1.4.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/similaritymeasures-{{ version }}.tar.gz
  sha256: 52032dd11ea3c0f94158e17df16f8d512101d6de0d31a2db42193f1434720572

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - numpy >=1.14.0
    - python >={{ python_min }}
    - scipy >=0.19.0

test:
  imports:
    - similaritymeasures
  commands:
    - pip check
  requires:
    - pip
    - setuptools
    - python {{ python_min }}

about:
  home: https://github.com/cjekel/similarity_measures
  summary: Quantify the difference between two arbitrary curves in space
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/cjekel/similarity_measures
  doc_url: https://jekel.me/similarity_measures/index.html

extra:
  recipe-maintainers:
    - melonhead901
